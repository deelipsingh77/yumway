<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - YUMWAY</title>
  <link rel="stylesheet" href="style.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <div class="navbar-logo">
      <img src="output-onlinepngtools-removebg-preview.png" alt="Logo">
    </div>
    <div class="navbar-toggle" id="navbar-toggle">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <div class="navbar-menu" id="navbar-menu">
      <a href="index.html">Home</a>
      <a href="#">About</a>
      <a href="#">Product</a>
      <a href="contact.html">Contact Us</a>
    </div>
  </nav>

  <!-- Contact Form Section -->
  <div class="container mt-5">
    <h2 class="heading">Contact Us</h2>
    
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="contact-form-container">
          <form id="contactForm">
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input type="text" class="form-control" id="name" placeholder="Your Name" required>
            </div>
            
            <div class="mb-3">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="tel" class="form-control" id="phone" placeholder="Your Phone Number" required>
            </div>
            
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="Your Email" required>
            </div>
            
            <div class="mb-3">
              <label for="message" class="form-label">Message</label>
              <textarea class="form-control" id="message" rows="5" placeholder="Your Message" required></textarea>
            </div>
            
            <div class="text-center">
              <button type="submit" class="btn btn-submit">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.5.1.js"></script>
  
  <script>
    // Toggle navbar menu for mobile
    document.getElementById('navbar-toggle').addEventListener('click', function() {
      this.classList.toggle('open');
      document.getElementById('navbar-menu').classList.toggle('active');
    });
    
    // Form submission handler
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      // Here you would typically add code to send the form data to your server
      alert('Thank you for your message! We will get back to you soon.');
      this.reset();
    });
  </script>
</body>
</html>
